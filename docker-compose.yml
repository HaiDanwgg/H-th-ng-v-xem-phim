name: cinema-booking

services:
  app:
    build: ./app
    environment:
      DB_HOST: db
      DB_NAME: cinema
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend-net, frontend-net]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: cinema
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [backend-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://localhost/pma/
    depends_on: [db]
    networks: [backend-net, frontend-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginxlogs:/var/log/nginx
    depends_on: [app, grafana, phpmyadmin]
    networks: [frontend-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]   # chi mo tren localhost de xem Targets/Alerts
    networks: [backend-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SERVER_ROOT_URL: "https://localhost/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    networks: [backend-net, frontend-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    networks: [backend-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  promtail:
    image: grafana/promtail:3.2.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginxlogs:/var/log/nginx:ro
    depends_on: [loki]
    networks: [backend-net]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    networks: [backend-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    command:
      - --config.my-cnf=/etc/mysqld.cnf
      - --mysqld.address=db:3306
    volumes:
      - ./monitoring/mysqld.cnf:/etc/mysqld.cnf:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [backend-net]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  dbdata:
  promdata:
  grafanadata:
  lokidata:
  nginxlogs:

networks:
  frontend-net:
  backend-net:
